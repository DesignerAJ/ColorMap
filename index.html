<!DOCTYPE html>
<html lang='ko-KR'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="apple-touch-icon" sizes="180x180" href="./image/apple-touch-icon.png">
    <!-- <link rel="shortcut icon" type="image/png" size="512x512" href="./image/android-chrome-512x512.png">
    <link rel="shortcut icon" type="image/png" size="192x192" href="./image/android-chrome-192x192.png"> -->
    <link rel="icon" type="image/png" sizes="32x32" href="./image/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./image/favicon-16x16.png">
    <link rel="manifest" href="./image/site.webmanifest">
    <title>ColorMap v1.3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap"
        rel="stylesheet">
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.13.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.13.0/mapbox-gl.css' rel='stylesheet' />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/monolith.min.css" />
    <link href='./data/style.css' rel='stylesheet' />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div id='country-selector-container'>
        <button id="minimize-button" class="minimize-button"><i class="fas fa-angle-up"></i></button>
        <div class="tab-header">
            <div class="tab-switch">
                <div class="tab-slider"></div>
                <button class="tab-button active" data-tab="country">국가별 선택</button>
                <i class="fa-solid fa-arrow-right-arrow-left tab-switch-icon"></i>
                <button class="tab-button" data-tab="province">대한민국 시도 선택</button>
            </div>
        </div>



        <div class="tab-content-container">
            <div id="country-tab-content" class="tab-content active">
                <div class="control-group-box" id="county-addminus-group">
                    <div class="control-group">
                        <label for="country-select-1">국가-1</label>
                        <input type="color" id="highlight-color-picker-1" value="#2eca89">
                        <div class="datalist-wrapper">
                            <input list="country-datalist-1" id="country-select-1" placeholder="국가 선택 or 검색.."
                                autocomplete="off">
                        </div>
                        <datalist id="country-datalist-1"></datalist>
                    </div>

                    <div class="control-group hidden" id="country-group-2">
                        <label for="country-select-2">국가-2</label>
                        <input type="color" id="highlight-color-picker-2" value="#29dff2">
                        <div class="datalist-wrapper">
                            <input list="country-datalist-2" id="country-select-2" placeholder="국가 선택 or 검색.."
                                autocomplete="off">
                        </div>
                        <datalist id="country-datalist-2"></datalist>
                    </div>

                    <div class="control-group hidden" id="country-group-3">
                        <label for="country-select-3">국가-3</label>
                        <input type="color" id="highlight-color-picker-3" value="#fcec26">
                        <div class="datalist-wrapper">
                            <input list="country-datalist-3" id="country-select-3" placeholder="국가 선택 or 검색.."
                                autocomplete="off">
                        </div>
                        <datalist id="country-datalist-3"></datalist>
                    </div>

                    <div class="control-group" id="country-buttons">
                        <button id="add-country">＋ <span class="max-text">(MAX: 3)</span></button>
                        <button id="remove-country" disabled>－</button>
                    </div>
                </div>
            </div>

            <div id="province-tab-content" class="tab-content hidden">
                <div class="control-group-box" id="province-addminus-group">
                    <div class="control-group">
                        <label for="province-select-1">시도-1</label>
                        <input type="color" id="highlight-color-picker-province-1" value="#2eca89">
                        <div class="datalist-wrapper">
                            <input list="province-datalist-1" id="province-select-1" placeholder="시도 선택 or 검색.."
                                autocomplete="off">
                        </div>
                        <datalist id="province-datalist-1"></datalist>
                    </div>

                    <div class="control-group hidden" id="province-group-2">
                        <label for="province-select-2">시도-2</label>
                        <input type="color" id="highlight-color-picker-province-2" value="#29dff2">
                        <div class="datalist-wrapper">
                            <input list="province-datalist-2" id="province-select-2" placeholder="시도 선택 or 검색.."
                                autocomplete="off">
                        </div>
                        <datalist id="province-datalist-2"></datalist>
                    </div>

                    <div class="control-group hidden" id="province-group-3">
                        <label for="province-select-3">시도-3</label>
                        <input type="color" id="highlight-color-picker-province-3" value="#fcec26">
                        <div class="datalist-wrapper">
                            <input list="province-datalist-3" id="province-select-3" placeholder="시도 선택 or 검색.."
                                autocomplete="off">
                        </div>
                        <datalist id="province-datalist-3"></datalist>
                    </div>

                    <div class="control-group" id="province-buttons">
                        <button id="add-province">＋ <span class="max-text">(MAX: 3)</span></button>
                        <button id="remove-province" disabled>－</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="control-group-box vertical-group" id="border-admin-color-group">
            <!-- 국경선 설정 그룹 -->
            <div class="line-item-group">
                <div class="control-group">
                    <label class="line-label" for="border-color-picker">국경선</label>
                    <input type="color" id="border-color-picker" value="#ffffff">
                    <span class="label-separator">┃</span>
                    <label class="line-label disputed-label" for="disputed-color-picker">분쟁지역선</label>
                    <input type="color" id="disputed-color-picker" value="#fff82e">
                </div>
                <div class="control-group line-property-row">
                    <div class="property-item">
                        <label class="line-property-label" for="border-opacity-slider">투명도</label>
                        <input type="range" id="border-opacity-slider" min="0" max="1" step="0.01" value="1">
                    </div>
                    <div class="property-item">
                        <label class="line-property-label" for="border-width-slider">두께</label>
                        <input type="range" id="border-width-slider" min="0" max="6" step="0.1" value="2">
                    </div>
                    <div class="property-item checkbox-item">
                        <label class="line-property-label" for="border-dotline-checker">점선</label>
                        <input type="checkbox" id="border-dotline-checker">
                    </div>
                </div>
            </div>

            <div class="group-separator"></div>

            <!-- 행정구역 설정 그룹 -->
            <div class="line-item-group">
                <div class="control-group">
                    <label class="line-label" for="admin-color-picker">행정구역선</label>
                    <input type="color" id="admin-color-picker" value="#ededed">
                </div>
                <div class="control-group line-property-row">
                    <div class="property-item">
                        <label class="line-property-label" for="admin-opacity-slider">투명도</label>
                        <input type="range" id="admin-opacity-slider" min="0" max="1" step="0.01" value="1">
                    </div>
                    <div class="property-item">
                        <label class="line-property-label" for="admin-width-slider">두께</label>
                        <input type="range" id="admin-width-slider" min="0" max="6" step="0.1" value="1">
                    </div>
                    <div class="property-item checkbox-item">
                        <label class="line-property-label" for="admin-dotline-checker">점선</label>
                        <input type="checkbox" id="admin-dotline-checker">
                    </div>
                </div>
            </div>
        </div>

        <div class="control-group-box solid-color-group" id="landwater-color-group">
            <div class="control-group" id="land-color-group">
                <label for="land-color-picker">육지색</label>
                <input type="color" id="land-color-picker" value="#8896a1">
            </div>
            <div class="control-group" id="water-color-group">
                <label for="water-color-picker">바다색</label>
                <input type="color" id="water-color-picker" value="#172c4d">
            </div>
            <div class="control-group" id="water-visible-group">
                <label for="water-checker">강·호수</label>
                <input type="checkbox" id="water-checker">
            </div>
        </div>

        <div class="control-group-box horizontal-group">
            <div class="control-group">
                <label for="style-select">스타일</label>
                <select id="style-select"></select>
                <select id="projection-select"></select>
            </div>
        </div>
        <div class="control-group-box" id="map-zoom-slider-group">
            <div class="control-group">
                <label for="map-zoom-slider">&nbsp;&nbsp;<i class="fa fa-search-plus"></i>&nbsp;&nbsp;</label>
                <input type="range" id="map-zoom-slider" min="1" max="16" step="0.1" value="6">
            </div>
        </div>
    </div>
    <div id='map'></div>

    <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
    <script src='./data/config.js'></script>
    <script type='module' src='./data/script.js'></script>
</body>

</html>
