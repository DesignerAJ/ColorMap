<!DOCTYPE html>
<html lang="ko-KR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="지도 영역 디자인과 카메라 경로 녹화를 하나의 화면에서 만드는 ColorMap">
    <link rel="apple-touch-icon" sizes="180x180" href="./image/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./image/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./image/favicon-16x16.png">
    <link rel="manifest" href="./image/site.webmanifest">
    <title>ColorMap v3.0</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">

    <!-- ?v= 는 브라우저 캐시를 끊는 용도다. 파일마다 값이 제각각이면
         (CSS 는 2.3.3, JS 는 2.2.0/2.2.9 처럼) 하나만 깜빡했을 때
         "CSS 는 새것, JS 는 옛것"이 캐시에 남아 원인 못 찾는 버그가 된다.
         고칠 때마다 아래 다섯 줄과 위 CSS 두 줄, script.js 의 PANEL_URL 을
         같은 값으로 함께 올린다. -->
    <script src="./recorder/js/vendor/mp4-muxer.js?v=3.2.18"></script>
    <script src="./recorder/js/config.js?v=3.2.18"></script>
    <script src="./recorder/js/data/regions.js?v=3.2.18"></script>
    <script src="./recorder/js/recorder.js?v=3.2.18"></script>
    <script type="module" src="./data/script.js?v=3.2.18"></script>
